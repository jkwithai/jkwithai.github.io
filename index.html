<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>제갈정 | Jegal Jeong</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./jk_favicon.png" type="image/png">
</head>
<body>
    <div class="background-blur"></div>
    
    <main class="container">
        <!-- 상단 명언 섹션 -->
        <section class="quote-section">
            <div id="quote-en">"Loading inspiration..."</div>
            <div id="quote-ko">영감을 불러오는 중입니다...</div>
        </section>

        <!-- 메인 히어로 섹션 -->
        <section class="hero-section">
            <h1>안녕하세요. <br><span class="name-gradient">제갈정</span>입니다.</h1>
            <p class="hero-text">AI와 기술을 통해 새로운 미래를 그려나가는 개인 홈페이지입니다. 매일 새로운 가치를 탐구하고 기록합니다.</p>
            <a href="https://github.com/jkwithai" class="cta-button" target="_blank">GitHub 프로필 방문</a>
        </section>

        <!-- 자동화 수집 섹션 -->
        <section class="automation-section">
            <h2 class="section-title">Daily Insights & Automation</h2>
            
            <div class="automation-grid">
                <!-- 날씨 및 코디 섹션 -->
                <div class="automation-card">
                    <h3 class="card-title">오늘의 날씨 & 코디</h3>
                    <div class="weather-wrapper" id="weather-info">
                        <div class="loading-placeholder">데이터를 불러오는 중...</div>
                    </div>
                </div>

                <!-- 네이버 경제 뉴스 -->
                <div class="automation-card">
                    <h3 class="card-title">네이버 경제 뉴스</h3>
                    <div class="finance-dashboard" id="finance-data"></div>
                    <div class="news-wrapper" id="naver-news">
                        <div class="loading-placeholder">데이터를 불러오는 중...</div>
                    </div>
                </div>

                <!-- 기업마당 지원사업 -->
                <div class="automation-card">
                    <h3 class="card-title">서울·경기 지원사업 (기업마당)</h3>
                    <div class="news-wrapper" id="bizinfo-news">
                        <div class="loading-placeholder">데이터를 불러오는 중...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
