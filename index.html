<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>제갈정 | Jegal Jeong</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="background-blur"></div>
    
    <main class="container">
        <!-- 상단 명언 섹션 -->
        <section class="quote-section">
            <div id="quote-en">"Loading inspiration..."</div>
            <div id="quote-ko">영감을 불러오는 중입니다...</div>
        </section>

        <!-- 메인 히어로 섹션 -->
        <section class="hero-section">
            <h1>안녕하세요. <br><span class="name-gradient">제갈정</span>입니다.</h1>
            <p class="hero-text">AI와 기술을 통해 새로운 미래를 그려나가는 개인 홈페이지입니다. 매일 새로운 가치를 탐구하고 기록합니다.</p>
            <a href="https://github.com/jkwithai" class="cta-button" target="_blank">GitHub 프로필 방문</a>
        </section>

        <!-- 자동화 수집 섹션 (iframe 틀) -->
        <section class="automation-section">
            <h2 class="section-title">Daily Insights & Automation</h2>
            <div class="iframe-wrapper">
                <!-- 실제 수집 데이터 주소가 있다면 src에 넣으시면 됩니다 -->
                <div class="iframe-placeholder">
                    <p>자동화된 데이터 수집 영역 (iframe 틀)</p>
                    <small>매일 자동으로 업데이트되는 콘텐츠가 이곳에 표시될 예정입니다.</small>
                </div>
                <!-- 예시: <iframe src="https://example.com/automation" width="100%" height="100%" frameborder="0"></iframe> -->
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
